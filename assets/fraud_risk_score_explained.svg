<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="white"/>
  <style>
    .title{font:700 54px Arial,sans-serif;fill:#111}
    .sub{font:400 28px Arial,sans-serif;fill:#222}
    .axis{font:400 25px Arial,sans-serif;fill:#111}
    .tick{font:400 22px Arial,sans-serif;fill:#222}
    .label{font:400 22px Arial,sans-serif;fill:#111}
    .foot{font:400 20px Arial,sans-serif;fill:#222}
  </style>
  <text x="800" y="55" text-anchor="middle" class="sub">Each application receives points for fraud-related signals found in the data.</text>
  <text x="800" y="92" text-anchor="middle" class="sub">More points = more fraud risk.</text>
  <text x="800" y="160" text-anchor="middle" class="title">Fraud Rate Increases with Risk Score</text>

  <line x1="100" y1="740" x2="1540" y2="740" stroke="#222" stroke-width="2"/>
  <line x1="100" y1="210" x2="100" y2="740" stroke="#222" stroke-width="2"/>

  <g stroke="#ddd" stroke-width="1">
    <line x1="100" y1="681" x2="1540" y2="681"/><line x1="100" y1="622" x2="1540" y2="622"/>
    <line x1="100" y1="563" x2="1540" y2="563"/><line x1="100" y1="504" x2="1540" y2="504"/>
    <line x1="100" y1="445" x2="1540" y2="445"/><line x1="100" y1="386" x2="1540" y2="386"/>
    <line x1="100" y1="327" x2="1540" y2="327"/><line x1="100" y1="268" x2="1540" y2="268"/>
  </g>

  <g class="tick" text-anchor="end">
    <text x="88" y="748">0</text><text x="88" y="689">5</text><text x="88" y="630">10</text><text x="88" y="571">15</text>
    <text x="88" y="512">20</text><text x="88" y="453">25</text><text x="88" y="394">30</text><text x="88" y="335">35</text>
    <text x="88" y="276">40</text><text x="88" y="217">45</text>
  </g>

  <g fill="#2f7fb8">
    <rect x="150" y="738.7" width="120" height="1.3"/>
    <rect x="325" y="736.1" width="120" height="3.9"/>
    <rect x="500" y="731.7" width="120" height="8.3"/>
    <rect x="675" y="723.5" width="120" height="16.5"/>
    <rect x="850" y="701.2" width="120" height="38.8"/>
    <rect x="1025" y="636.0" width="120" height="104.0"/>
    <rect x="1200" y="533.4" width="120" height="206.6"/>
    <rect x="1375" y="237.8" width="120" height="502.2"/>
  </g>

  <g class="label" text-anchor="middle">
    <text x="210" y="724">0.11%</text><text x="385" y="722">0.33%</text><text x="560" y="717">0.70%</text><text x="735" y="709">1.40%</text>
    <text x="910" y="687">3.29%</text><text x="1085" y="622">8.81%</text><text x="1260" y="519">17.51%</text><text x="1435" y="224">42.55%</text>
  </g>

  <g class="tick" text-anchor="middle">
    <text x="210" y="775">0</text><text x="385" y="775">1</text><text x="560" y="775">2</text><text x="735" y="775">3</text>
    <text x="910" y="775">4</text><text x="1085" y="775">5</text><text x="1260" y="775">6</text><text x="1435" y="775">7</text>
  </g>

  <text x="820" y="820" text-anchor="middle" class="axis">Total Risk Points</text>
  <text x="35" y="475" text-anchor="middle" class="axis" transform="rotate(-90 35 475)">Fraud Rate (%)</text>
  <text x="800" y="870" text-anchor="middle" class="foot">Examples of risk signals: high credit risk, low name/email similarity, invalid home phone information, and unusual account/device patterns.</text>
</svg>